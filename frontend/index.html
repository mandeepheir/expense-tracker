<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="header-section">

            <div>
                <h1>Expense Tracker</h1>

                <p class="text-muted mb-0">
                    Track and manage your daily expenses
                </p>
            </div>

            <button
                id="themeButton"
                class="btn btn-dark"
                type="button"
            >
                🌙 Dark Mode
            </button>

        </div>


        <!-- Add / Edit Expense -->
        <div
            class="card shadow-sm mx-auto mb-4"
            style="max-width: 700px;"
        >

            <div class="card-body p-4">

                <h3
                    id="formTitle"
                    class="mb-4"
                >
                    Add Expense
                </h3>

                <form id="expenseForm">

                    <div class="mb-3">

                        <label
                            for="expenseName"
                            class="form-label"
                        >
                            Expense Name
                        </label>

                        <input
                            type="text"
                            id="expenseName"
                            class="form-control"
                            placeholder="e.g. Groceries"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="amount"
                            class="form-label"
                        >
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            class="form-control"
                            placeholder="e.g. 500"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="category"
                            class="form-label"
                        >
                            Category
                        </label>

                        <select
                            id="category"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="mb-4">

                        <label
                            for="date"
                            class="form-label"
                        >
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        id="submitButton"
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Add Expense
                    </button>


                    <button
                        id="cancelEditButton"
                        type="button"
                        class="btn btn-secondary w-100 mt-2"
                        style="display: none;"
                    >
                        Cancel Edit
                    </button>

                </form>

            </div>

        </div>


        <!-- Search and Filter -->
        <div
            class="card shadow-sm mx-auto mb-4"
            style="max-width: 700px;"
        >

            <div class="card-body">

                <h5 class="mb-3">
                    Search & Filter
                </h5>


                <div class="mb-3">

                    <label
                        for="searchExpense"
                        class="form-label fw-semibold"
                    >
                        Search Expenses
                    </label>

                    <input
                        type="text"
                        id="searchExpense"
                        class="form-control"
                        placeholder="Search by expense name or category..."
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="filterCategory"
                        class="form-label fw-semibold"
                    >
                        Filter by Category
                    </label>

                    <select
                        id="filterCategory"
                        class="form-select"
                    >

                        <option value="All">
                            All Categories
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <button
                    id="exportButton"
                    class="btn btn-success w-100"
                    type="button"
                >
                    Export Expenses to CSV
                </button>

            </div>

        </div>


        <!-- Dashboard -->
        <div class="row g-4 mx-auto mb-4 dashboard-row">

            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm dashboard-card h-100">

                    <div class="card-body text-center">

                        <p class="dashboard-title">
                            Total Expenses
                        </p>

                        <h3 id="totalExpenses">
                            ₹0.00
                        </h3>

                    </div>

                </div>

            </div>


            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm dashboard-card h-100">

                    <div class="card-body text-center">

                        <p class="dashboard-title">
                            Number of Expenses
                        </p>

                        <h3 id="expenseCount">
                            0
                        </h3>

                    </div>

                </div>

            </div>


            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm dashboard-card h-100">

                    <div class="card-body text-center">

                        <p class="dashboard-title">
                            Average Expense
                        </p>

                        <h3 id="averageExpense">
                            ₹0.00
                        </h3>

                    </div>

                </div>

            </div>


            <div class="col-md-6 col-lg-3">

                <div class="card shadow-sm dashboard-card h-100">

                    <div class="card-body text-center">

                        <p class="dashboard-title">
                            Highest Expense
                        </p>

                        <h3 id="highestExpense">
                            ₹0.00
                        </h3>

                    </div>

                </div>

            </div>

        </div>


        <!-- Category Chart -->
        <div
            class="card shadow-sm mx-auto mb-4"
            style="max-width: 700px;"
        >

            <div class="card-body p-4">

                <h3 class="mb-4 text-center">
                    Spending by Category
                </h3>

                <div class="chart-container">

                    <canvas id="expenseChart"></canvas>

                </div>

            </div>

        </div>


        <!-- Monthly Chart -->
        <div
            class="card shadow-sm mx-auto mb-4"
            style="max-width: 1000px;"
        >

            <div class="card-body p-4">

                <h3 class="mb-4 text-center">
                    Monthly Spending
                </h3>

                <div class="monthly-chart-container">

                    <canvas id="monthlyChart"></canvas>

                </div>

            </div>

        </div>


        <!-- Expense History -->
        <div
            class="card shadow-sm mx-auto"
            style="max-width: 1000px;"
        >

            <div class="card-body p-4">

                <h3 class="mb-4">
                    Expense History
                </h3>


                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>

                            <tr>

                                <th>Expense</th>

                                <th>Amount</th>

                                <th>Category</th>

                                <th>Date</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="expenseList">
                        </tbody>

                    </table>

                </div>


                <p
                    id="emptyMessage"
                    class="text-center text-muted"
                >
                    No expenses found.
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
